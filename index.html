<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steyer Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b1e;--ink:#f4f1ff;--mute:#a9a3cf;--panel:rgba(22,18,52,.72);--line:rgba(255,255,255,.12);--a:#ff7ab8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:600 16px/1.35 Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0}#fx{pointer-events:none;z-index:50}
.app{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:1fr 390px;gap:20px;padding:18px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;text-align:center}
h1{font:400 clamp(34px,6vw,64px)/1 'Lilita One',sans-serif;margin:0;background:linear-gradient(90deg,#ffd60a,#ff2d2d,#38d66b,#3b82ff,#22e6ff,#f5b82e,#c8e63a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(0,0,0,.25);filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.score b{display:block;font:400 clamp(40px,7vw,76px)/1 'Lilita One';text-shadow:0 0 28px var(--a)}
.score span{color:var(--mute)}.score small{display:block;color:var(--a);font-weight:800}
#face{height:min(44vh,430px);max-width:86vw;aspect-ratio:1;border:0;border-radius:26px;overflow:hidden;padding:0;background:#1a1540;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 7px var(--a),0 0 60px 8px var(--a),0 18px 40px rgba(0,0,0,.5);transition:box-shadow .3s}
#face:focus-visible{outline:4px solid #fff;outline-offset:8px}#face img{width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block;pointer-events:none}
.skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:520px}
.sk{width:46px;height:58px;border-radius:10px;border:3px solid var(--line);padding:0;overflow:hidden;background:#1a1540;cursor:pointer}
.sk img{width:100%;height:100%;display:block;object-fit:contain}.sk.on{border-color:var(--c);box-shadow:0 0 14px var(--c)}.sk.lock{filter:grayscale(1) brightness(.35);cursor:not-allowed}
#skinname{margin:0;font:400 22px 'Lilita One';color:var(--a)}#buff{min-height:26px;font-weight:800;color:#ffd60a}
.panel{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex}.tabs button{flex:1;padding:12px;background:none;border:0;color:var(--mute);font:400 20px 'Lilita One';cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--a)}
.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}.list[hidden]{display:none}
.it{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:8px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;cursor:pointer}
.it:disabled{opacity:.45;cursor:not-allowed}.it:not(:disabled):hover{border-color:var(--c);background:rgba(255,255,255,.1)}
.it img{width:56px;height:70px;object-fit:contain;border-radius:10px;border:2px solid var(--c);background:#1a1540}.it i{font-style:normal;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--c);color:#111;font:400 24px 'Lilita One'}
.it strong{display:block;font:400 18px 'Lilita One';color:var(--c)}.it small{color:var(--mute);display:block}.it em{font-style:normal;font-weight:800}.it .n{font:400 30px 'Lilita One';opacity:.7;text-align:right}
.foot{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line)}.foot button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer}
.gold{position:fixed;z-index:40;width:84px;height:84px;border-radius:50%;border:0;padding:0;cursor:pointer;background:#fff;box-shadow:0 0 0 5px gold,0 0 50px 14px gold;animation:fl 2s ease-in-out infinite alternate}
.gold img{width:100%;height:100%;border-radius:50%;filter:sepia(1) saturate(5) brightness(1.15)}@keyframes fl{to{transform:translateY(-18px) rotate(8deg)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:60;background:#fff;color:#111;padding:10px 18px;border-radius:99px;font-weight:800;transition:.3s;pointer-events:none;text-align:center}
#toast.s{transform:translate(-50%,0);opacity:1}
.acct{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.acct img{width:38px;height:38px;border-radius:50%;border:2px solid var(--a);background:#222;flex:none}.acct div{flex:1;min-width:0}
.acct b{display:block;font:400 17px 'Lilita One';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{color:var(--mute);display:block;font-size:12px}
.acct button{padding:7px 12px;border-radius:99px;border:2px solid var(--a);background:none;color:var(--ink);font:800 14px Nunito;cursor:pointer}.acct button:disabled{opacity:.4;cursor:not-allowed}
.tabs button{font-size:18px}
.row{display:grid;grid-template-columns:42px 46px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.04)}
.row.me{border-color:var(--a);background:rgba(255,255,255,.1)}.row img{width:46px;height:58px;object-fit:contain;border-radius:8px;background:#1a1540}.row .rk{font:400 18px 'Lilita One';text-align:center}
.row .nm{min-width:0}.row .nm strong{display:block;font:400 17px 'Lilita One';overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .nm small{color:var(--mute)}.row .sc{font:400 22px 'Lilita One'}
.note{color:var(--mute);text-align:center;padding:20px 8px;margin:0}.sep{color:var(--mute);text-align:center;font-size:13px}
#modal{position:fixed;inset:0;z-index:70;background:rgba(5,3,20,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}#modal[hidden]{display:none}
.card{width:min(420px,100%);background:#171236;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 0 50px var(--a)}
.card h2{margin:0 0 6px;font:400 28px 'Lilita One'}.card p{color:var(--mute);margin:6px 0}.card input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0d0b1e;color:var(--ink);font:800 18px Nunito;margin-top:6px;user-select:text;-webkit-user-select:text}.card input:focus{outline:none;border-color:var(--a)}
.card .bad{color:#ff7b7b}.card .ok{color:#7dffa0}.card .btns{display:flex;gap:10px;margin-top:14px}.card .btns button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);font:400 18px 'Lilita One';cursor:pointer}
.card .btns #go{background:var(--a);color:#111;border-color:var(--a)}.card .btns button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:860px){body{overflow:auto}.app{grid-template-columns:1fr;height:auto;min-height:100%}.center{padding-top:6px}.panel{max-height:70vh}}
@media(prefers-reduced-motion:reduce){.gold{animation:none}}
</style></head><body>
<canvas id="bg"></canvas>
<main class="app">
<section class="center">
<h1>Steyer Clicker</h1>
<div class="score"><b id="sp">0</b><span>Steyer Points</span><small id="cps">0 per second</small></div>
<button id="face" aria-label="Click Steyer"><img id="fimg" alt=""></button>
<p id="skinname"></p><div id="skins" class="skins"></div><div id="buff"></div>
</section>
<aside class="panel">
<div class="acct"><img id="av" alt=""><div><b id="an">Guest</b><small id="as">Checking account...</small></div><button id="ab" disabled>Sign in</button></div>
<div class="tabs" role="tablist"><button id="t0" class="on">Steyers</button><button id="t1">Upgrades</button><button id="t2">Ranks</button></div>
<div id="shop" class="list"></div><div id="ups" class="list" hidden></div><div id="lb" class="list" hidden></div>
<div class="foot"><button id="mute">Sound: on</button><button id="reset">Reset game</button></div>
</aside></main>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt" hidden><div class="card">
<h2 id="mt">Sign in to Steyer Clicker</h2>
<p>You are signed in to Claude as <b id="mname"></b>. Your account saves your game online and puts you on the leaderboard.</p>
<div id="ret" hidden><p>Welcome back, <b id="rname"></b>!</p></div>
<div id="newp"><label for="nm">Choose a player name</label><input id="nm" maxlength="14" autocomplete="off" spellcheck="false"><p id="nmsg" role="status"></p></div>
<div class="btns"><button id="guest">Play as guest</button><button id="go">Create account</button></div>
</div></div>
<canvas id="fx"></canvas><div id="toast" role="status"></div>

function renderAcct(){const a=$('#av'),b=$('#ab');
if(signed){a.src=ME.avatarUrl;$('#an').textContent=player.name;$('#as').textContent='Cloud save on';b.textContent='Sign out';b.disabled=false}
else{a.src=FACE.orig;$('#an').textContent='Guest';$('#as').textContent=canAcct()?'Sign in to save online and rank':'Open in claude.ai to sign in';b.textContent='Sign in';b.disabled=!canAcct()}renderLB()}
function renderLB(){const el=$('#lb');el.textContent='';const note=m=>{const p=document.createElement('p');p.className='note';p.textContent=m;el.append(p)};
if(!signed)return note(canAcct()?'Sign in to see the leaderboard and add your score.':'The leaderboard needs a signed-in claude.ai session.');
if(lbErr)return note('The leaderboard could not load. Try again in a moment.');
if(!LB.length)return note('No scores yet. Be the first!');
const mk=(r,rank)=>{const d=document.createElement('div');d.className='row'+(r.id===ME.id?' me':'');const rk=document.createElement('span');rk.className='rk';rk.textContent=rank;
const im=document.createElement('img');im.alt='';im.src=FACE[r.skin]||FACE.orig;const w=document.createElement('span');w.className='nm';const s=document.createElement('strong');s.textContent=String(r.name||'Steyer fan');
const sm=document.createElement('small');sm.textContent=f(Number(r.cps)||0)+'/s · '+(Number(r.n)||0)+' types';w.append(s,sm);const sc=document.createElement('span');sc.className='sc';sc.textContent=f(Number(r.tot)||0);d.append(rk,im,w,sc);return d};
LB.slice(0,25).forEach((r,i)=>el.append(mk(r,i<3?['🥇','🥈','🥉'][i]:'#'+(i+1))));
const mi=LB.findIndex(r=>r.id===ME.id);if(mi<0||mi>=25){const h=document.createElement('div');h.className='sep';h.textContent='Your score';el.append(h,mk(Object.assign(statBody(player.name),{id:ME.id}),mi<0?'-':'#'+(mi+1)))}}
function subLb(){if(unLb)unLb();lbErr='';unLb=DB.collection('players').orderBy('tot','desc').limit(50).onSnapshot(s=>{lbErr='';LB=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));renderLB()},e=>{lbErr=e&&e.code||'x';renderLB()})}
async function push(force){if(!signed||busy)return;if(!force&&S.tot===pushed)return;busy=true;
try{const b=statBody(player.name);if(!Number.isFinite(b.tot)||b.tot<0)return;await pdoc.set(b);const c=Object.assign({},S);delete c.fr;c.t=Date.now();await sdoc.set(c);pushed=S.tot}
catch(e){if(e&&e.code==='invalid_argument'&&!push.warned){push.warned=1;toast('You have view-only access, so scores cannot be saved online.')}}finally{busy=false}}
setInterval(()=>push(),15000);document.addEventListener('visibilitychange',()=>{if(document.hidden)push()});
async function claim(name){const slot=DB.doc('names/'+name.toLowerCase().replace(/ /g,'_'));const r=await slot.acquire({holder:ME.id,ttlMs:4000});if(!r.acquired)return'busy';
const sn=await slot.get();if(sn.exists&&sn.data().uid&&sn.data().uid!==ME.id)return'taken';await slot.set({uid:ME.id});return'ok'}
async function enter(){try{const sg=await sdoc.get();if(sg.exists){const c=sg.data();if((Number(c.tot)||0)>S.tot){const keep=S.mute;S=Object.assign({sp:0,tot:0,own:{},up:{},skin:'orig',fr:0,mute:keep},c);S.fr=0;
['sp','tot'].forEach(k=>{if(!Number.isFinite(S[k])||S[k]<0)S[k]=0});if(!SK.some(k=>k.id===S.skin))S.skin='orig';build();setSkin(S.skin);ui();toast('Cloud save loaded!')}}}catch(e){}
signed=true;try{localStorage.setItem(SIGNED,'1')}catch(e){}subLb();renderAcct();toast('Signed in as '+player.name);push(1)}
async function boot(){try{if(window.claude&&claude.use){[UC,DB]=await Promise.all([claude.use('user'),claude.use('db')]);ME=UC?await UC.me():null}}catch(e){}
renderAcct();if(!canAcct())return;pdoc=DB.doc('players/'+ME.id);sdoc=DB.doc('data/users/'+ME.id+'/save');
try{const ps=await pdoc.get();player=ps.exists?ps.data():null}catch(e){}
let was='';try{was=localStorage.getItem(SIGNED)}catch(e){}if(was&&player&&player.name)enter();else openModal()}
function openModal(){const ret=!!(player&&player.name);$('#modal').hidden=false;$('#mname').textContent=(ME&&ME.name)||'your account';$('#newp').hidden=ret;$('#ret').hidden=!ret;$('#rname').textContent=ret?player.name:'';$('#go').textContent=ret?'Sign in':'Create account';
if(ret){$('#go').disabled=false;$('#go').focus()}else{const sg=clean(((ME&&ME.name)||'').replace(/[^A-Za-z0-9 _-]/g,'')).slice(0,14);$('#nm').value=sg.length>=3?sg:'Steyer'+(1000+Math.random()*9000|0);chk();$('#nm').focus()}}
function chk(){const e=vName($('#nm').value),m=$('#nmsg');m.textContent=e||'Looks good. Uniqueness is checked when you create the account.';m.className=e?'bad':'ok';$('#go').disabled=!!e}
$('#nm').oninput=chk;$('#guest').onclick=()=>{$('#modal').hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});
$('#ab').onclick=async()=>{if(signed){await push(1);if(unLb)unLb();unLb=null;signed=false;LB=[];try{localStorage.removeItem(SIGNED)}catch(e){}renderAcct();toast('Signed out. Progress stays on this device.')}else openModal()};
$('#go').onclick=async()=>{const b=$('#go'),m=$('#nmsg');b.disabled=true;
try{if(!(player&&player.name)){const n=clean($('#nm').value);if(vName(n)){chk();return}
const r=await claim(n);if(r!=='ok'){m.textContent=r==='taken'?'That name is taken. Try another.':'Someone is claiming it right now. Try again.';m.className='bad';return}
const body=statBody(n);await pdoc.set(body);player=body}
$('#modal').hidden=true;await enter()}
catch(e){m.hidden=false;m.textContent=e&&e.code==='invalid_argument'?'Your access here is view-only, so accounts cannot be created. Ask the owner for Contributor access.':'Could not finish. Please try again.';m.className='bad';$('#newp').hidden=false}
finally{b.disabled=false}};
/* ---------- start ---------- */
const im=new Image();im.onload=()=>{gen(im);ui();requestAnimationFrame(loop);boot();setTimeout(gold,R(15000,25000));setInterval(()=>{try{localStorage.setItem('steyer1',JSON.stringify(S))}catch(e){}},4000)};im.src=IMG;
</script></body></html>
